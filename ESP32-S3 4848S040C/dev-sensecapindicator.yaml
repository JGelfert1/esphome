esphome:
  name: dev-sensecapindicator
  friendly_name: DEV-SensecapIndicator
  platformio_options:
    build_unflags: -Werror=all

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: 5.2.2
    platform_version: 6.7.0
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz
    
# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
# Enable Home Assistant API
api:
  encryption:
    key: "PRQMvvo15Lcg0OgAbWkVJeTgNT8uW0RbbhpPGFqUkYU="

ota:
  - platform: esphome
    password: "e5d46ae61405cf18aa0442c6cf2e4e68"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-4848S040 Fallback Hotspot"
    password: "Lmq9uEjt87Wv"

captive_portal:

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Zurich
    servers:
     - 192.168.166.1 #mein Router, falls das Internet mal Pause macht
    on_time_sync:
      - script.execute: time_update
    on_time:
      - minutes: '*'
        seconds: 0
        then:
          - script.execute: time_update

script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: lvgl_clock_minute
          text:
            format: "%02d"
            args: [ 'id(sntp_time).now().minute' ]

      - lvgl.label.update:
          id: lvgl_clock_hour
          text:
            format: "%02d"
            args: [ 'id(sntp_time).now().hour' ]
      - lvgl.label.update:
          id: lvgl_clock_longdate
          text:
            format: "%s, %02d.%02d.%04d"
            args: 
              - '(new const char *[7]{"Sunntig", "Määntig", "Ziischtig", "Mittwuch", "Dunschtig", "Friitig", "Samschtig"})[id(sntp_time).now().day_of_week-1]'
              - 'id(sntp_time).now().day_of_month'
              - 'id(sntp_time).now().month'
              - 'id(sntp_time).now().year'
          
  - id: back_to_timepage
    mode: restart
    then:
      - delay: 5 min
      - lvgl.page.show: page_time
      
