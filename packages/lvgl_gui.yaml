# 1. Home Assistant Sensoren importieren

sensor:
  - platform: homeassistant
    id: temp_wohnzimmer
    entity_id: sensor.temperatur_wohnzimmer_temperatur
    on_value:
      then:
        - lvgl.label.update:
            id: label_temp_wohnzimmer
            text: !lambda 'return str_sprintf("%.1f °C", id(temp_wohnzimmer).state);'

  - platform: homeassistant
    id: temp_buro
    entity_id: sensor.temperatur_buro_temperatur
    on_value:
      then:
        - lvgl.label.update:
            id: label_temp_buro
            text: !lambda 'return str_sprintf("%.1f °C", id(temp_buro).state);'

  - platform: homeassistant
    id: temp_kuche
    entity_id: sensor.temperatur_kuche_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: label_temp_kuche
            text: !lambda 'return str_sprintf("%.1f °C", id(temp_kuche).state);'

  - platform: homeassistant
    id: temp_badezimmer
    entity_id: sensor.thermometer_badezimmer_temperatur
    on_value:
      then:
        - lvgl.label.update:
            id: label_temp_badezimmer
            text: !lambda 'return str_sprintf("%.1f °C", id(temp_badezimmer).state);'

  - platform: homeassistant
    id: temp_garten
    entity_id: sensor.thermometer_garten_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: label_temp_garten
            text: !lambda 'return str_sprintf("%.1f °C", id(temp_garten).state);'


  - platform: homeassistant
    id: ha_rolladen_position
    entity_id: cover.han_fun_2_f1
    attribute: current_position
    on_value:
      then:
        - lvgl.slider.update:
            id: rolladen_slider
            value: !lambda 'return int(x);'

font:
  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_regular_20
    size: 20
    bpp: 4
    glyphsets:
      - GF_Latin_Kernel
      - GF_Latin_Core
    glyphs:
      - "äöüÄÖÜß°"

  - file:
      type: gfonts
      family: Roboto
      weight: 700
    id: font_bold_24
    size: 24
    bpp: 4
    glyphsets:
      - GF_Latin_Kernel
      - GF_Latin_Core
    glyphs:
      - "äöüÄÖÜß°"

  - file:
      type: gfonts
      family: Roboto
      weight: 400
    id: font_regular_14
    size: 14
    bpp: 4
    glyphsets:
      - GF_Latin_Kernel
      - GF_Latin_Core
    glyphs:
      - "äöüÄÖÜß°"

lvgl:

  theme:
    dark_mode: true

  style_definitions:
    - id: style_dark_bg
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      radius: 0
    - id: style_white_text
      text_color: 0xFFFFFF
    - id: style_temperature
      text_color: 0xFFFFFF
      text_font: font_regular_20
    - id: style_title
      text_color: 0xFFFFFF
      text_font: font_bold_24
    - id: style_tile
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 2
      border_color: 0xB0B0B0
      radius: 0
      pad_all: 6
    - id: style_room_name
      text_color: 0xFFFFFF
      text_font: font_regular_14
      align: TOP_LEFT
    - id: style_tile_temperature
      text_color: 0xFFFFFF
      text_font: font_bold_24
      align: CENTER
      text_align: CENTER

  pages:
      - id: page_temp
        styles:
          - style_dark_bg
        widgets:
        - obj:
            x: 0
            y: 0
            width: 100%
            height: 100%
            styles:
              - style_dark_bg
            clickable: true
            on_click:
              - lvgl.page.next:
            # Zwei Spalten mit festen rechteckigen Kacheln.
            layout:
              type: FLEX
              flex_flow: ROW_WRAP
              flex_align_main: CENTER
              flex_align_cross: CENTER
              pad_row: 8
              pad_column: 8
            widgets:
              - obj:
                  width: 110
                  height: 80
                  styles:
                    - style_tile
                  widgets:
                    - label:
                        text: "Wohnzimmer"
                        styles:
                          - style_room_name
                    - label:
                        id: label_temp_wohnzimmer
                        text: "--.- °C"
                        width: 100%
                        height: SIZE_CONTENT
                        styles:
                          - style_tile_temperature

              - obj:
                  width: 110
                  height: 80
                  styles:
                    - style_tile
                  widgets:
                    - label:
                        text: "Büro"
                        styles:
                          - style_room_name
                    - label:
                        id: label_temp_buro
                        text: "--.- °C"
                        width: 100%
                        height: SIZE_CONTENT
                        styles:
                          - style_tile_temperature

              - obj:
                  width: 110
                  height: 80
                  styles:
                    - style_tile
                  widgets:
                    - label:
                        text: "Küche"
                        styles:
                          - style_room_name
                    - label:
                        id: label_temp_kuche
                        text: "--.- °C"
                        width: 100%
                        height: SIZE_CONTENT
                        styles:
                          - style_tile_temperature

              - obj:
                  width: 110
                  height: 80
                  styles:
                    - style_tile
                  widgets:
                    - label:
                        text: "Badezimmer"
                        styles:
                          - style_room_name
                    - label:
                        id: label_temp_badezimmer
                        text: "--.- °C"
                        width: 100%
                        height: SIZE_CONTENT
                        styles:
                          - style_tile_temperature

              - obj:
                  width: 110
                  height: 80
                  styles:
                    - style_tile
                  widgets:
                    - label:
                        text: "Garten"
                        styles:
                          - style_room_name
                    - label:
                        id: label_temp_garten
                        text: "--.- °C"
                        width: 100%
                        height: SIZE_CONTENT
                        styles:
                          - style_tile_temperature

      - id: page_shutter
        styles:
          - style_dark_bg
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 100%
              clickable: true
              on_click:
                - lvgl.page.next:
              widgets:
                - label:
                    styles:
                     - style_title
                    align: CENTER
                    text: "Rolladensteuerung"
                - obj:
                    align: CENTER
                    width: 420
                    height: 120
                    bg_color: 0x202020
                    border_width: 1
                    border_color: 0xB0B0B0
                    radius: 0
                    widgets:
                      - label:
                          text: "Wohnzimmer rechts"
                          text_font: font_regular_14
                          text_color: 0xFFFFFF
                          align: TOP_LEFT
                          x: 10
                          y: 8
                      - slider:
                          id: rolladen_slider
                          align: CENTER
                          min_value: 0
                          max_value: 100
                          width: 380
                          height: 36
                          on_release:
                            - logger.log:
                                format: "Rolladen Wohnzimmer rechts: %.0f%%"
                                args: [ 'x' ]
                            - homeassistant.action:
                                action: cover.set_cover_position
                                data:
                                  entity_id: cover.han_fun_2_f1
                                  position: !lambda 'return int(x);'

      - id: page_light
        styles:
          - style_dark_bg
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 100%
              clickable: true
              on_click:
                - lvgl.page.next:
              widgets:
                - label:
                    styles:
                     - style_title
                    align: CENTER
                    text: "Lichtschalter"