lvgl:

  theme:
    dark_mode: true

  style_definitions:
    - id: style_dark_bg
      bg_color: 0x000000
      bg_opa: COVER
      border_width: 0
      radius: 0
    - id: style_white_text
      text_color: 0xFFFFFF

  pages:
      - id: page_temp
        styles:
          - style_dark_bg
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 100%
              clickable: true
              on_click:
                - lvgl.page.next:
              widgets:
                - label:
                    styles:
                     - style_white_text
                    align: CENTER
                    text: "Temperaturen"

      - id: page_shutter
        styles:
          - style_dark_bg
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 100%
              clickable: true
              on_click:
                - lvgl.page.next:
              widgets:
                - label:
                    styles:
                     - style_white_text
                    align: CENTER
                    text: "Rolladensteuerung"

      - id: page_light
        styles:
          - style_dark_bg
        widgets:
          - obj:
              x: 0
              y: 0
              width: 100%
              height: 100%
              clickable: true
              on_click:
                - lvgl.page.next:
              widgets:
                - label:
                    styles:
                     - style_white_text
                    align: CENTER
                    text: "Lichtschalter"