
esphome:
  name: "sunton-2432s028"
  friendly_name: "Sunton ESP32-2432s028"
  comment: "Sunton ESP32-2432s028"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    
logger:
  level: DEBUG
    
#Enable Home Assistant API
# Api-key aus secrets.yaml
api:
  encryption:
    key: !secret sunton_2432s028__api_key
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password:
    !secret wifi_password


packages:
  lvgl: !include packages/lvgl_gui.yaml
  
# ============================================================ 
# Home Assistant related setup
#
light:
  - platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    id: backlight
    restore_mode: ALWAYS_ON

# Setup a pin to control the backlight
output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    
# SPI-Bus für das Display
spi:
  - id: display_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: 
      number: 12
      ignore_strapping_warning: true
      

# Separater SPI-Bus für den XPT2046 Touch-Controller
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

# Touchscreen Konfiguration
touchscreen:
  - platform: xpt2046
    id: my_touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860

# Display Schnittstelle über MIPI DBI SPI
display:
  - platform: ili9xxx
    id: my_display
    model: ili9341
    spi_id: display_spi
    cs_pin: GPIO15
    dc_pin: GPIO2
    invert_colors: false
    color_order: RGB
    # WICHTIG: Native Pixelmaße im Hochformat angeben!
    transform: 
      swap_xy: true
      mirror_x: false
      mirror_y: false


# Onboard-LED zum Testen der Button-Aktion
switch:
  - platform: gpio
    pin:
      number: GPIO4
      inverted: true
    name: "Onboard LED"
    id: onboard_led

# LVGL GUI Definition
lvgl:
  buffer_size: 30%
  rotation: 90
  displays:
    - my_display
  touchscreens:
    - my_touch